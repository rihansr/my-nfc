name: my_nfc
description: "Read/Write NFC"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Media
  iconsax: ^0.0.8
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.4
  youtube_player_iframe: ^6.0.2
  video_player: ^2.11.1
  chewie: ^1.15.0

  # UI
  responsive_framework: ^1.5.1
  flutter_native_splash : ^2.4.7
  lottie: ^3.6.1
  google_fonts: ^8.2.1
  flex_color_picker: ^3.8.0

  # Local DB
  shared_preferences: ^2.5.6
  hive: ^2.2.3

  # network
  http: ^1.2.2
  flutter_dio_http_cache: ^0.3.1

  # state management
  provider: ^6.1.5+1

  # Others
  collection: ^1.19.1
  go_router: ^17.5.0
  encrypt: ^5.0.3
  fluttertoast: ^9.1.0
  url_launcher: ^6.3.3
  flutter_contacts: ^2.1.0
  visibility_detector: ^0.4.0+2
  path_provider: ^2.1.6
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
    - assets/files/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Thin.ttf
          weight: 100
          style: normal

        - asset: assets/fonts/Inter-ExtraLight.ttf
          weight: 200
          style: normal

        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
          style: normal

        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
          style: normal

        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
          style: normal

        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
          style: normal

        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
          style: normal

        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
          style: normal

        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
          style: normal